spring:
  application:
    name: social_backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:social_backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:60000ms}
      client_type: lettuce



  datasource:
    url: jdbc:mysql://localhost:3306/social_tt?useSSL=false
    username: root
    password: "01112004"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  calls:
    ringing-timeout-seconds: ${CALL_RINGING_TIMEOUT_SECONDS:30}
    # ACCEPTED calls without a heartbeat/signal for this long are ended (clients send one every 15s).
    heartbeat-timeout-seconds: ${CALL_HEARTBEAT_TIMEOUT_SECONDS:45}
    expiry-scan-ms: ${CALL_EXPIRY_SCAN_MS:5000}
    expiry-initial-delay-ms: ${CALL_EXPIRY_INITIAL_DELAY_MS:5000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  refresh-token:
    expiration-ms: 604800000
  login-approval:
    risk-threshold: 70
    expiration-ms: 300000
    otp:
      email-enabled: ${LOGIN_OTP_EMAIL_ENABLED:false}
      debug-enabled: ${LOGIN_OTP_DEBUG_ENABLED:true}
  mail:
    from: ${MAIL_FROM:}

chat:
  rate-limit:
    messages-per-second: 5
    messages-per-minute: 30
    attachments-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

webrtc:
  metered:
    api-key: ${METERED_API_KEY:}
    credentials-url: ${METERED_CREDENTIALS_URL:https://socicalandroid.metered.live/api/v1/turn/credentials}
    cache-ttl-seconds: ${METERED_CACHE_TTL_SECONDS:300}
